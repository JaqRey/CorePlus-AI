<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CorePlus AI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="auth-container">
    <div class="brand">
      <div class="logo-mark">
        <img src="/static/images/logo.png" alt="CorePlus Logo" class="brand-logo" />
      </div>
      <div>
        <h1 class="brand-name">CorePlus AI</h1>
        <p class="brand-sub">Your AI Fitness Companion</p>
      </div>
    </div>

    <div class="auth-card">
      <h2 class="card-title">Welcome back</h2>
      <p class="card-desc">Sign in to continue your fitness journey</p>

      <div id="error-msg" class="msg msg-error" style="display:none"></div>
      <div id="success-msg" class="msg msg-success" style="display:none"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button class="eye-btn" onclick="togglePassword()" type="button" aria-label="Show password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-primary" id="login-btn" onclick="handleLogin()">
        <span class="btn-text">Sign In</span>
        <span class="btn-loader" style="display:none">Loading…</span>
      </button>

      <p class="switch-auth">
        Don't have an account? <a href="/register">Create one</a>
      </p>
    </div>

    <p class="disclaimer">⚡ Powered by Gemini AI · Not medical advice</p>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
